# Test Configuration for Multi-Turn RAG Pipeline
# This config uses HuggingFace embeddings to avoid API quotas

# Embedding Configuration
embedding:
  provider: huggingface
  model_id: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  task_type: retrieval_document

# Text Model Configuration  
text_model:
  provider: gemini
  model_id: gemini-2.5-flash
  temperature: 0.1
  max_tokens: 512
  top_p: 0.9

# Retrieval Configuration (smaller values for testing)
retrieval:
  bm25_top_k: 5
  dense_top_k: 5
  final_top_k: 3
  max_candidates: 20

# Query Diversification Configuration
query_diversification:
  num_variants: 3
  use_entity_focus: true
  use_action_focus: true
  use_paraphrase: true
  use_relation_focus: false  # Disable to reduce variants for testing